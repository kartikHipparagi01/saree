{% extends 'base.html' %}

{% block title %}Sign In - Saree Factory Portal{% endblock %}

{% block head %}
<style>
    /* STANDALONE OVERRIDES FOR SIGN IN PAGE */
    .sidebar, .top-header, .sidebar-notch, .sidebar-overlay {
        display: none !important;
    }
    .app-container {
        display: flex !important;
        width: 100% !important;
        min-height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .main-content {
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        min-height: 100vh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
    .login-wrapper {
        width: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        
        <div class="login-header">
            <div class="brand-logo" style="width: 54px; height: 54px; font-size: 26px; border-radius: 16px; margin-bottom: 8px;">S</div>
            <h2 style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Saree Factory Portal</h2>
            <p class="login-subtitle">Production Management & Settlements System</p>
        </div>
        
        <form action="{{ url_for('auth.login') }}" method="POST" style="display: flex; flex-direction: column; gap: 18px;">
            
            <div class="form-group">
                <label for="username">Username / Email</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;"></i>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter username or email" required style="padding-left: 44px; width: 100%;">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;"></i>
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required style="padding-left: 44px; padding-right: 44px; width: 100%;">
                    <button type="button" id="password-toggle" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;" title="Show Password">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="captcha">6-Digit Security Captcha</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div style="position: relative; flex: 1;">
                        <i class="fa-solid fa-shield-halved" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;"></i>
                        <input type="text" name="captcha" id="captcha" class="form-control" placeholder="CAPTCHA" required maxlength="6" style="padding-left: 44px; width: 100%; letter-spacing: 4px; font-weight: 800; text-align: center; text-transform: uppercase;">
                    </div>
                    <div id="captcha-box" style="width: 120px; height: 44px; background: linear-gradient(135deg, #0f172a, #1f2937); border: 2px dashed var(--accent-indigo); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; font-family: 'Courier New', monospace; letter-spacing: 4px; color: #f59e0b; user-select: none; font-style: italic; text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer;" title="Click to refresh">
                        {{ session.get('captcha', '') }}
                    </div>
                    <button type="button" id="refresh-captcha" class="btn btn-secondary" style="height: 44px; width: 44px; border-radius: 12px; padding: 0; display: flex; align-items: center; justify-content: center;" title="Refresh Captcha">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted);">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="remember" style="accent-color: var(--accent-indigo); cursor: pointer;"> Remember me
                </label>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 50px; font-size: 14px; margin-top: 4px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In to Account
            </button>
        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Password Reveal Action toggle
    const pwdInput = document.getElementById('password');
    const pwdToggle = document.getElementById('password-toggle');
    if (pwdInput && pwdToggle) {
        pwdToggle.addEventListener('click', () => {
            const isPassword = pwdInput.getAttribute('type') === 'password';
            pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            const icon = pwdToggle.querySelector('i');
            if (isPassword) {
                icon.className = 'fa-solid fa-eye-slash';
                pwdToggle.setAttribute('title', 'Hide Password');
            } else {
                icon.className = 'fa-solid fa-eye';
                pwdToggle.setAttribute('title', 'Show Password');
            }
        });
    }

    // Captcha Refresh Action
    const captchaBox = document.getElementById('captcha-box');
    const refreshBtn = document.getElementById('refresh-captcha');
    
    function refreshCaptcha() {
        fetch('/captcha')
            .then(response => response.json())
            .then(data => {
                if (captchaBox) {
                    captchaBox.textContent = data.captcha;
                }
            })
            .catch(err => console.error("Error refreshing captcha:", err));
    }
    
    if (captchaBox) {
        captchaBox.addEventListener('click', refreshCaptcha);
    }
    if (refreshBtn) {
        refreshBtn.addEventListener('click', refreshCaptcha);
    }
</script>
{% endblock %}
